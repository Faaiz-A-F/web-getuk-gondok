services:
  mysql:
    image: mysql:8.0
    container_name: getuk-gondok-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: getuk_gondok
      MYSQL_USER: getuk_user
      MYSQL_PASSWORD: getuk_password
    ports:
      - "3306:3306"
    volumes:
      - getuk_mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: getuk-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: getuk-gondok-db
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    ports:
      - "8080:80"

volumes:
  getuk_mysql_data:
